services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_USER: todo_user
      DB_PASSWORD: localpassword
      DB_NAME: todo_db
      INSTANCE_CONNECTION_NAME: local
    ports:
      - "8080:8080"
    depends_on:
      - database

volumes:
  postgres_data: