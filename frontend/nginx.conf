
server {
    listen 8080;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://todo-backend-r7ayhnynfq-ew.a.run.app;

        proxy_ssl_server_name on;

        proxy_set_header Host todo-backend-r7ayhnynfq-ew.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}